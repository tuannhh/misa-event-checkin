# ============================================================
# Chạy MISA Event Check-in trên hạ tầng nội bộ bằng Docker Compose.
#   docker compose -f docker-compose.internal.yml up -d --build
#   docker compose -f docker-compose.internal.yml logs -f
#   docker compose -f docker-compose.internal.yml down          (giữ dữ liệu)
#   docker compose -f docker-compose.internal.yml down -v       (XOÁ luôn dữ liệu)
# Kiến trúc: dịch vụ "app" (Node/Express + Vue) + "mysql" (CSDL) + "redis" (session +
# hàng đợi email cảm ơn - bắt buộc nếu sau này chạy app.scale > 1, xem lib/redis.js).
# Dữ liệu nằm trong 2 volume:
#   - checkin-mysql : toàn bộ database MySQL
#   - checkin-data  : uploads/ảnh (nếu có)
# => KHÔNG mất khi restart/rebuild. Redis không cần volume (session/queue mất khi restart
#   là chấp nhận được - user chỉ cần đăng nhập lại, không mất dữ liệu nghiệp vụ).
# ============================================================
services:
  redis:
    image: redis:7-alpine
    container_name: checkin-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  mysql:
    image: mysql:8.0                             # pin 8.0: ổn định + hỗ trợ mysql_native_password (8.4 đã bỏ tuỳ chọn này)
    container_name: checkin-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpw               # ĐỔI khi chạy thật
      - MYSQL_DATABASE=checkin
      - MYSQL_USER=checkin
      - MYSQL_PASSWORD=checkinpw                 # ĐỔI khi chạy thật (khớp DB_PASSWORD của app)
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - checkin-mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpw"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile.internal
    image: misa-event-checkin:noibo
    container_name: misa-event-checkin
    depends_on:
      mysql:
        condition: service_healthy               # đợi MySQL sẵn sàng mới khởi động app
      redis:
        condition: service_healthy
    ports:
      - "8080:3000"                              # đổi cổng ngoài nếu cần: "8080:3000"
    environment:
      - DB_HOST=mysql                            # tên dịch vụ MySQL ở trên
      - DB_PORT=3306
      - DB_USER=checkin
      - DB_PASSWORD=checkinpw
      - DB_NAME=checkin
      - REDIS_URL=redis://redis:6379             # session store + hàng đợi email cảm ơn
      - PORT=3000
      - DATA_DIR=/data
      # ĐỔI chuỗi bí mật này khi chạy thật (ký session đăng nhập). Sinh bằng: openssl rand -hex 32
      - SESSION_SECRET=doi-chuoi-bi-mat-nay-khi-chay-that
      # Tài khoản Super Admin đầu tiên (chỉ dùng để tạo lúc DB rỗng) - ĐỔI khi chạy thật:
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=doi-mat-khau-nay-khi-chay-that
      # Khoá mã hoá smtp_pass/brevo_api_key lưu trong DB - ĐỔI khi chạy thật. Sinh bằng: openssl rand -base64 32
      # Không đặt biến này thì bí mật vẫn lưu được (dev/local) nhưng KHÔNG được mã hoá.
      - ENCRYPTION_KEY=
      # Nếu chạy sau proxy HTTPS + gửi email qua Brevo, khai báo URL công khai để ảnh trong email hiển thị được:
      # - BASE_URL=https://checkin.noi-bo.misa.vn
    volumes:
      - checkin-data:/data
    restart: unless-stopped

volumes:
  checkin-mysql:
  checkin-data:
